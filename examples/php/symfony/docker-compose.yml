# The same image deployed four ways.
#
#   docker compose up consumer     # long-running queue consumer
#   docker compose run --rm import # one-off console command
#   docker compose run --rm rebuild
#   docker compose run --rm single-message

services:
  # A long-running Messenger consumer. Scale it horizontally; SIGTERM on
  # redeploy finishes the message in flight and exits 0.
  consumer:
    build: .
    command: ["consume", "async"]
    environment:
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f/messages
      # Recycle the container periodically instead of chasing memory leaks.
      WORKER_MESSAGE_LIMIT: "500"
      WORKER_TIME_LIMIT: "3600"
      WORKER_MEMORY_LIMIT: "256M"
      WORKER_LOG_FORMAT: json
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      replicas: 3

  # An existing console command, run as a job.
  import:
    build: .
    command: ["console", "app:import-ledger", "2024-Q4"]
    environment:
      # A job that hangs should fail rather than run forever.
      WORKER_TIMEOUT: "1800"

  # A handler-mode worker, with its input as JSON. This is the shape an ECS
  # RunTask-per-job deployment takes: WORKER_JOB_ID matches whatever id the
  # caller already tracks the job by, and DynamoJobReporter keeps a status
  # record of it independent of the container's own exit code - claimed,
  # then succeeded/failed/stopped, with a heartbeat in between. Set
  # WORKER_SHUTDOWN_TIMEOUT below the ECS task's own stop timeout so a wedged
  # run reports "stopped/forced" itself before ECS has to SIGKILL it.
  rebuild:
    build: .
    command: ["handler", "App\\Worker\\RebuildSearchIndex"]
    environment:
      WORKER_JOB_ID: "job-42"
      WORKER_PAYLOAD: '{"companyId": 42, "since": "2024-01-01"}'
      WORKER_JOB_REPORTER: App\Reporting\DynamoJobReporter
      WORKER_SHUTDOWN_TIMEOUT: "45"

  # One message, one container: the shape that suits an external scheduler,
  # where the exit code decides whether the message is acked or retried.
  single-message:
    build: .
    command: ["message"]
    environment:
      WORKER_MESSAGE_CLASS: App\Message\SendReport
      WORKER_PAYLOAD: '{"companyId": 42, "period": "quarterly"}'

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
